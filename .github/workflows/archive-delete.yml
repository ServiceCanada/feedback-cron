name: Archive Quarter Delete

# Triggered automatically when the "Archive Quarter Export" workflow completes
# successfully. Also supports manual dispatch for testing.
#
# This workflow deletes from MongoDB the same quarter that was exported to CSV
# by the export workflow. Safety guard: before deleting, it looks up the CSV
# backup in Azure Blob Storage and reads its doc_count metadata. The delete
# script aborts if no backup exists or if the database holds more documents for
# the quarter than were backed up. This also protects manual dispatches, which
# don't depend on an export run.
#
# Required secrets: MONGO_DB_WRITE, AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, AZURE_STORAGE_ACCOUNT, AZURE_STORAGE_CONTAINER
# (same as archive-export.yml).

on:
  # Auto-runs after the export workflow completes. The job below additionally
  # guards on conclusion == 'success', so a failed export never triggers a
  # delete.
  workflow_run:
    workflows: ["Archive Quarter Export"]
    types:
      - completed
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: read
  id-token: write # Lets azure/login request an OIDC token instead of a stored secret
  issues: write   # Lets a failed run open an issue so it gets noticed

# Never run two deletes at once: a manual run started during the automatic
# one waits for it to finish instead of deleting the same quarter in parallel.
concurrency:
  group: archive-delete
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    # Only run if the export workflow succeeded (or on manual dispatch)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Always run the reviewed scripts on main, even for manual dispatches
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # PyMongo 4.18 requires MongoDB wire version 9; the Cosmos DB server
      # reports 8, so 4.17 is the newest release that can connect.
      - name: Install dependencies
        run: pip install "pymongo<4.18"

      - name: Resolve archive quarter
        id: quarter
        run: python scripts/archive_quarter.py

      - name: Log in to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Look up CSV backup in Azure Blob Storage
        id: backup
        run: |
          blob="${{ steps.quarter.outputs.blob_name }}"
          exists=$(az storage blob exists \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ secrets.AZURE_STORAGE_CONTAINER }}" \
            --name "$blob" \
            --auth-mode login \
            --query exists -o tsv)
          count=""
          if [ "$exists" = "true" ]; then
            count=$(az storage blob metadata show \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --container-name "${{ secrets.AZURE_STORAGE_CONTAINER }}" \
              --name "$blob" \
              --auth-mode login \
              --query doc_count -o tsv)
          fi
          echo "Backup blob '$blob' exists: $exists, doc_count: ${count:-<none>}"
          echo "doc_count=$count" >> "$GITHUB_OUTPUT"

      - name: Delete archive quarter from MongoDB
        env:
          MONGO_DB_WRITE: ${{ secrets.MONGO_DB_WRITE }}
          BACKUP_DOC_COUNT: ${{ steps.backup.outputs.doc_count }}
        run: python scripts/delete_archive_quarter.py

      # Covers both errors and the safety guard refusing to delete. Open an
      # issue so the quarter left in the database gets looked at.
      - name: Open an issue if the delete failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Archive delete failed for ${{ steps.quarter.outputs.archive_label || 'unknown quarter' }} ($(date -u +%Y-%m-%d))" \
            --body "The archive delete failed or refused to run. Check the log: if the safety guard stopped it, the backup in Azure Blob is missing or holds fewer documents than the database. Some documents may already have been deleted if it failed partway; the run log shows how many.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
