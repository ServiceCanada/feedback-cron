# Validates that a pull request would build and deploy cleanly, without
# touching the cluster. The deploy itself runs from main.yml on push to
# main, after review.
name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VIEWER_REF: main

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Check out feedback-viewer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ServiceCanada/feedback-viewer
          ref: ${{ env.VIEWER_REF }}
          path: feedback-viewer
          persist-credentials: false

      - name: Install feedback-viewer classes and local jars
        run: |
          mvn -B -q -DskipTests -f feedback-viewer/pom.xml install
          mvn -B install:install-file -Dfile="lib/airtable.java-0.2.0.jar" -DgroupId="com.sybit" -DartifactId="airtable.java" -Dversion="0.2.0" -Dpackaging=jar -DgeneratePom=true

      - name: Build and test
        run: mvn -B verify

      # Build only. Nothing is pushed to the registry and no image tagged
      # here can reach the cluster.
      - name: Build image
        run: docker build -f ./docker/Dockerfile . -t feedback-cj:${{ github.sha }}

      # Validates the manifest main.yml deploys against the Kubernetes
      # schemas offline. kubectl dry-run cannot be used here: it needs a
      # cluster to fetch schemas from, and this workflow has no cluster access.
      - name: Validate Kubernetes manifest
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary kubernetes/feedback-cronjob.yml
